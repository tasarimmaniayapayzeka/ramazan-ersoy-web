---
# cPanel Git™ Version Control dağıtım tarifi
# ------------------------------------------------------------
# Kurulum (cPanel'de bir kez):
#   Git Version Control → Create
#     Clone URL       : https://github.com/tasarimmaniayapayzeka/ramazan-ersoy-web.git
#     Repository Path : /home/drramazanersoy/repos/ramazan-ersoy-web
#     Repository Name : ramazan-ersoy-web
#   Sonra: Manage → Pull or Deploy → "Update from Remote" → "Deploy HEAD Commit"
#
# Bundan sonra her yayın: GitHub'a push → cPanel'de tek "Deploy" tıklaması.
# (İstenirse GitHub webhook ile bu tıklama da otomatikleşir.)
#
# NOT: --delete BİLİNÇLİ olarak kapalı. Açılırsa public_html'de repoda
# olmayan her şey (cgi-bin, e-posta klasörleri, sonradan eklenen PHP
# chatbot dosyaları) SİLİNİR. Sadece ne yaptığını bilerek aç.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - >
      /usr/bin/rsync -a
      --exclude='.git'
      --exclude='.gitignore'
      --exclude='.cpanel.yml'
      --exclude='.claude'
      --exclude='server.js'
      --exclude='build-sitemap.js'
      --exclude='yayin-paketi-olustur.js'
      --exclude='assets/fonts/css2.txt'
      --exclude='assets/fonts/fraunces.txt'
      --exclude='assets/fonts/manifest.json'
      --exclude='*.md'
      --exclude='cgi-bin'
      ./ $DEPLOYPATH/
    - /bin/echo "Yayin tamamlandi: $(date)" >> $HOME/deploy.log
