---
# cPanel Git™ Version Control dağıtım tarifi
# ------------------------------------------------------------
# NOT: rsync bu sunucuda çalışmadı (mt-lunar / LiteSpeed, shell erişimi
# kapalı). Bu yüzden yalnızca /bin/cp ve /bin/rm kullanılıyor.
#
# Kabuk globu (*) gizli dosyaları KAPSAMAZ — bu bizim işimize geliyor:
# .git, .gitignore, .cpanel.yml kendiliğinden dışarıda kalıyor.
# .htaccess ise gizli olduğu için AYRICA kopyalanmak zorunda.
#
# Kurulum (bir kez yapıldı): Git Version Control → Create →
#   Clone URL: https://github.com/tasarimmaniayapayzeka/ramazan-ersoy-web.git
#   Path: repositories/ramazan-ersoy-web
# Sonraki her yayın: GitHub'a push → Update from Remote → Deploy HEAD Commit
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH
    # site dosyaları (glob gizli dosyaları atlar)
    - /bin/cp -R * $DEPLOYPATH/
    # .htaccess gizli olduğu için ayrıca
    - /bin/cp -f .htaccess $DEPLOYPATH/.htaccess
    # sunucuda işi olmayan geliştirme dosyalarını temizle
    - /bin/rm -f $DEPLOYPATH/server.js
    # WP ice aktarma dosyasi: repo'da durur, web'den ERISILMEMELI
    # (icerik zaten sayfalarda ama ham dump'i servis etmeye gerek yok)
    - /bin/rm -f $DEPLOYPATH/wp-icerik.xml
    - /bin/rm -f $DEPLOYPATH/build-sitemap.js
    - /bin/rm -f $DEPLOYPATH/yayin-paketi-olustur.js
    - /bin/rm -f $DEPLOYPATH/assets/fonts/css2.txt
    - /bin/rm -f $DEPLOYPATH/assets/fonts/fraunces.txt
    - /bin/rm -f $DEPLOYPATH/assets/fonts/manifest.json
    # ---------- WordPress teması ----------
    # Tema deponun wp-tema/ klasöründe geliştirilir, sunucuda WordPress'in
    # beklediği yere kopyalanır. Böylece tema da git geçmişine girer ve
    # bozulursa "git revert + deploy" ile bir dakikada geri alınır.
    # NOT: yukarıdaki "cp -R *" wp-tema/ klasörünü public_html köküne de
    # bırakıyor; web'den erişilmemesi için sonra siliniyor.
    - /bin/mkdir -p $DEPLOYPATH/wp-yeni/wp-content/themes/drre
    - /bin/cp -R wp-tema/. $DEPLOYPATH/wp-yeni/wp-content/themes/drre/
    - /bin/rm -rf $DEPLOYPATH/wp-tema
    # mu-plugin: adres sabitleyici (17 Agu kazasi — Ayarlar>Genel'de iki adres
    # birden koke cevrilince panel kilitlendi; adresler artik koddan gelir).
    # cPanel API ile dosya olusturma guvenilmez cikti, git deploy tek dogru yol.
    - /bin/mkdir -p $DEPLOYPATH/wp-yeni/wp-content/mu-plugins
    - /bin/cp -R wp-mu/. $DEPLOYPATH/wp-yeni/wp-content/mu-plugins/
    - /bin/rm -rf $DEPLOYPATH/wp-mu
    # yoast-tazele.php tek seferlikti (bayat canonical temizligi, 17 Agu);
    # cp silinen dosyayi sunucudan kaldirmaz, bu satir kaldirir.
    - /bin/rm -f $DEPLOYPATH/wp-yeni/wp-content/mu-plugins/yoast-tazele.php
    - /bin/rm -f $DEPLOYPATH/wp-yeni/wp-content/mu-plugins/baslik-doldur.php
    - /bin/echo "Yayin: $(date)" >> $HOME/deploy.log
